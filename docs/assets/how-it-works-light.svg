<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="dt dd"><title id="dt">How nitelos works</title><desc id="dd">Your host collects and normalizes evidence and writes the criteria. nitelos checks every criterion against that evidence, without clicking, fetching or retrying, and returns an execution status, a decision of success, failure or abstained, and the evidence references behind every decided criterion.</desc><rect x="40" y="70" width="470" height="420" rx="6" fill="#F3F4F6" stroke="#C9CED6" stroke-width="2"/><text x="70" y="116" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="650" fill="#101318" text-anchor="start">your host</text><text x="70" y="148" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5A6271" text-anchor="start">agent runner, test harness, CI job</text><text x="70" y="200" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#101318" text-anchor="start">collects and normalizes the evidence:</text><rect x="72" y="231" width="14" height="14" fill="#1F6FD1"/><text x="98" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" font-weight="400" fill="#101318" text-anchor="start">observation</text><text x="290" y="244" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5A6271" text-anchor="start">DOM / API state</text><rect x="72" y="275" width="14" height="14" fill="#1F6FD1"/><text x="98" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" font-weight="400" fill="#101318" text-anchor="start">screenshot</text><text x="290" y="288" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5A6271" text-anchor="start">image + digest</text><rect x="72" y="319" width="14" height="14" fill="#1F6FD1"/><text x="98" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" font-weight="400" fill="#101318" text-anchor="start">action</text><text x="290" y="332" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5A6271" text-anchor="start">what the tool reported</text><rect x="72" y="363" width="14" height="14" fill="#1F6FD1"/><text x="98" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" font-weight="400" fill="#101318" text-anchor="start">external read</text><text x="290" y="376" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5A6271" text-anchor="start">+ TrustBinding</text><text x="70" y="446" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#101318" text-anchor="start">and writes the criteria:</text><text x="70" y="476" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="400" fill="#1F6FD1" text-anchor="start">/validation_error equals false</text><path d="M510 280 H590" stroke="#1F6FD1" stroke-width="3" fill="none"/><path d="M590 269 V291" stroke="#1F6FD1" stroke-width="4"/><rect x="590" y="150" width="420" height="260" rx="6" fill="#F3F4F6" stroke="#C9CED6" stroke-width="2"/><text x="800" y="214" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#101318" text-anchor="middle">nitelos</text><text x="800" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" font-weight="400" fill="#101318" text-anchor="middle">Verifier().verify(request)</text><text x="800" y="316" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5A6271" text-anchor="middle">checks every criterion against</text><text x="800" y="342" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5A6271" text-anchor="middle">the evidence it was given</text><text x="800" y="384" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5A6271" text-anchor="middle">no clicks, no fetches, no retries</text><path d="M1010 280 H1090" stroke="#1F6FD1" stroke-width="3" fill="none"/><path d="M1090 269 V291" stroke="#1F6FD1" stroke-width="4"/><rect x="1090" y="70" width="470" height="420" rx="6" fill="#F3F4F6" stroke="#C9CED6" stroke-width="2"/><text x="1120" y="116" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="650" fill="#101318" text-anchor="start">result</text><text x="1120" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="400" fill="#5A6271" text-anchor="start">execution_status</text><text x="1340" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="400" fill="#101318" text-anchor="start">ok</text><text x="1120" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="400" fill="#5A6271" text-anchor="start">decision</text><rect x="1120" y="235" width="24" height="24" fill="#1E7A47"/><text x="1160" y="256" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="650" fill="#1E7A47" text-anchor="start">success</text><text x="1300" y="256" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5A6271" text-anchor="start">every criterion supported</text><rect x="1120" y="289" width="24" height="24" fill="#C2412F"/><path d="M1120 313 L1144 289" stroke="#F3F4F6" stroke-width="4"/><text x="1160" y="310" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="650" fill="#C2412F" text-anchor="start">failure</text><text x="1300" y="310" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5A6271" text-anchor="start">a criterion refuted</text><rect x="1122" y="345" width="20" height="20" fill="none" stroke="#8A5A00" stroke-width="4"/><text x="1160" y="364" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="650" fill="#8A5A00" text-anchor="start">abstained</text><text x="1300" y="364" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5A6271" text-anchor="start">not enough evidence</text><text x="1120" y="446" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5A6271" text-anchor="start">plus the evidence references</text><text x="1120" y="474" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5A6271" text-anchor="start">behind every decided criterion</text></svg>
