[project]
name = "nitelos"
version = "0.1.0"
description = "Verify the outcome, not the attempt: evidence-based success verification for AI agents."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nitelos contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.14.1,<3",
    "pillow>=12.3.0,<13",
]

[project.optional-dependencies]
eval = [
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]
local = [
    "torch==2.14.1+cpu",
    "torchvision==0.29.1+cpu",
    "transformers==5.19.0",
    "num2words>=0.5.14",
]
otel = [
    "opentelemetry-api>=1.45.1,<2",
]
# empty named extras: stdlib-only collectors (ADR-014 finding 4; uniform install command)
git = []
junit = []
github = []
claude-code = []
http = []
deepeval = [
    "deepeval>=2.0",
]
mcp = [
    "mcp>=1.0",
]
inspect = [
    "inspect-ai>=0.3.282,<0.4",
]
langgraph = [
    "langgraph>=0.2",
]
playwright = [
    "playwright>=1.40",
]

[project.scripts]
nitelos-hook = "nitelos.claude_code:main"

[dependency-groups]
dev = [
    "hatchling>=1.32.4",
    "mypy>=2.4.0",
    "opentelemetry-sdk>=1.45.1,<2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["src/nitelos"]

[tool.hatch.build.targets.sdist]
include = ["src/nitelos", "tests", "README.md", "LICENSE", "pyproject.toml"]
exclude = ["tests/**/*.safetensors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not local_model and not paid_api and not github_live"]
markers = [
    "local_model: real local model inference; requires NITELOS_RUN_LOCAL=1 and NITELOS_MODEL_DIR",
    "paid_api: reserved; v0.1 ships no paid adapter",
    "github_live: live GitHub REST against a real PR; requires GITHUB_TOKEN and NITELOS_RUN_GITHUB_LIVE=1",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF", "SIM", "PT", "C4", "PL"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "S108", "PLC0415"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["nitelos"]
warn_unreachable = true

[[tool.mypy.overrides]]
# optional local-model dependencies (NIT-008 local extra): absent in core-only
# environments, imported lazily inside nitelos.backends.smolvlm functions
module = ["torch", "transformers"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# NIT-026 (deepeval extra, deliberately NOT in the dev group): absent in
# core-only environments, imported lazily inside the metric module
module = ["deepeval", "deepeval.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# NIT-024 (inspect extra, not in the dev group): absent in core-only environments
module = ["inspect_ai", "inspect_ai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# NIT-027 (mcp extra, not in the dev group): absent in core-only environments
module = ["mcp", "mcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# NIT-025 (langgraph extra, not in the dev group): absent in core-only environments
module = ["langgraph", "langgraph.*", "langchain_core", "langchain_core.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# NIT-022 (playwright extra, not in the dev group): absent in core-only environments
module = ["playwright", "playwright.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# the metric subclasses deepeval's BaseMetric, which is Any when the extra is
# absent; its attr-defined ignore only fires when the extra IS installed
module = "nitelos.integrations.deepeval_metric"
disallow_subclassing_any = false
warn_unused_ignores = false
