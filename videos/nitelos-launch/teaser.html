<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>nitelos: teaser (8 s)</title>
    <script src="/assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Archivo"; src: url("/assets/fonts/Archivo-VF.ttf") format("truetype"); font-weight: 100 900; font-stretch: 62% 125%; }
      @font-face { font-family: "Martian Mono"; src: url("/assets/fonts/MartianMono-VF.ttf") format("truetype"); font-weight: 100 800; }
      :root { --ground: #101318; --panel: #171b22; --ink: #f4f1e9; --muted: #8a93a3; --line: #59616f; --evidence: #79bfff; --refuted: #ff877a; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground); color: var(--ink); }
      .clip { position: absolute; inset: 0; }
      .abs { position: absolute; }
      .label { font-family: "Martian Mono"; font-variation-settings: "wdth" 100, "wght" 400; font-size: 26px; line-height: 1; color: var(--muted); white-space: nowrap; }
      .panel { position: absolute; background: var(--panel); border: 2px solid var(--line); border-radius: 6px; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="teaser" data-start="0" data-width="1080" data-height="1920" data-duration="8">
      <section id="story" class="clip" data-start="0" data-duration="5.9" data-track-index="1">
        <!-- the claim -->
        <div class="panel" id="claim" style="left: 86px; top: 520px; width: 908px; height: 300px">
          <div class="label abs" style="left: 40px; top: 40px">agent summary</div>
          <!-- intentional: the strike-through crosses the claim once the evidence lands -->
          <div class="abs" data-layout-allow-occlusion style="left: 40px; top: 118px; font-family: Archivo; font-variation-settings: 'wdth' 62, 'wght' 800; font-size: 104px; line-height: 1; white-space: nowrap">registration succeeded</div>
          <div id="strike" style="position: absolute; left: 32px; top: 168px; width: 832px; height: 12px; background: var(--refuted); transform-origin: 0 50%"></div>
        </div>
        <!-- the evidence -->
        <div class="panel" id="obs" style="left: 86px; top: 880px; width: 908px; height: 190px">
          <div style="position: absolute; left: 40px; top: 38px; width: 22px; height: 22px; background: var(--evidence)"></div>
          <div class="label abs" style="left: 76px; top: 36px">final state of the form</div>
          <div class="abs" style="left: 40px; top: 100px; font-family: 'Martian Mono'; font-variation-settings: 'wdth' 100, 'wght' 400; font-size: 46px; line-height: 1; white-space: nowrap"><span style="color: var(--muted)">validation_error </span><span style="color: var(--refuted)">true</span></div>
        </div>
        <!-- the verdict -->
        <div class="abs" id="verdict" style="left: 86px; top: 1140px; width: 908px; height: 200px">
          <div class="label abs" style="left: 120px; top: 0">decision</div>
          <svg width="96" height="96" viewBox="0 0 110 110" style="position: absolute; left: 0; top: 44px"><rect width="110" height="110" fill="#ff877a" /><path d="M0 110 L110 0" stroke="#101318" stroke-width="14" /></svg>
          <div id="vword" style="position: absolute; left: 120px; top: 34px; font-family: Archivo; --wdth: 62; font-variation-settings: 'wdth' var(--wdth), 'wght' 700; font-size: 130px; line-height: 1; color: var(--refuted); white-space: nowrap">failure</div>
        </div>
        <div class="label abs" style="left: 86px; top: 1548px">synthetic example · real output</div>
      </section>

      <section id="brand" class="clip" data-start="5.6" data-duration="2.4" data-track-index="2">
        <div class="abs" id="brand-cover" style="left: 0; top: 0; width: 1080px; height: 1920px; background: var(--ground)"></div>
        <img id="wordmark" src="/assets/svg/nitelos-wordmark-dark-open.svg" alt="nitelos" style="position: absolute; left: 160px; top: 760px; width: 760px" />
        <svg class="abs" width="1080" height="1920" viewBox="0 0 1080 1920" style="left: 0; top: 0"><path id="drop-line" d="M279.75 300 V875.96" fill="none" stroke="#79bfff" stroke-width="4" /></svg>
        <div id="dock-square" style="position: absolute; left: 265.27px; top: 875.96px; width: 28.95px; height: 28.95px; background: var(--evidence)"></div>
        <div id="tagline" style="position: absolute; left: 0; width: 1080px; top: 990px; text-align: center; font-family: Archivo; font-variation-settings: 'wdth' 112, 'wght' 500; font-size: 42px; line-height: 1">Verify the outcome, not the attempt.</div>
      </section>

      <audio id="music" src="/assets/audio/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3" data-start="0" data-duration="8" data-track-index="10" data-volume="0.85"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.3,"v":0.85},{"t":7.2,"v":0.85},{"t":8,"v":0}]}]}'></audio>
      <audio id="sfx-claim" src="/assets/audio/sfx/impactSoft_medium_002.ogg" data-start="0.1" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-obs" src="/assets/audio/sfx/click2.ogg" data-start="2.19" data-track-index="12" data-volume="0.6"></audio>
      <audio id="sfx-v" src="/assets/audio/sfx/impactSoft_heavy_003.ogg" data-start="3.82" data-track-index="13" data-volume="0.55"></audio>
      <audio id="sfx-dock" src="/assets/audio/sfx/impactBell_heavy_000.ogg" data-start="6.35" data-track-index="14" data-volume="0.55"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const ARRIVE = "expo.out";
      tl.fromTo("#claim", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.45, ease: ARRIVE }, 0.1);
      // beat grid (vol-12): evidence 2.19, verdict 3.82
      tl.fromTo("#obs", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.4, ease: ARRIVE }, 2.19);
      tl.fromTo("#strike", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: ARRIVE }, 2.6);
      tl.fromTo("#verdict svg", { scale: 0 }, { scale: 1, duration: 0.35, ease: ARRIVE, transformOrigin: "50% 50%" }, 3.82);
      tl.fromTo("#verdict .label", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 3.85);
      tl.fromTo("#vword", { opacity: 0, "--wdth": 62 }, { opacity: 1, "--wdth": 125, duration: 0.7, ease: ARRIVE }, 3.82);
      tl.fromTo("#brand-cover", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 5.6);
      tl.fromTo("#wordmark", { opacity: 0, clipPath: "inset(100% 0 0 0)" }, { opacity: 1, clipPath: "inset(0% 0 0 0)", duration: 0.45, ease: ARRIVE }, 5.85);
      const line = document.querySelector("#drop-line");
      const len = line.getTotalLength();
      tl.fromTo(line, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.35, ease: "none" }, 6.0);
      tl.fromTo("#dock-square", { opacity: 0 }, { opacity: 1, duration: 0.08 }, 6.0);
      tl.fromTo("#dock-square", { y: -575.96 }, { y: 0, duration: 0.35, ease: "none" }, 6.0); // docks at 6.35
      tl.to(line, { opacity: 0, duration: 0.3 }, 6.5);
      tl.fromTo("#tagline", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: ARRIVE }, 6.6);
      window.__timelines["teaser"] = tl;
    </script>
  </body>
</html>
